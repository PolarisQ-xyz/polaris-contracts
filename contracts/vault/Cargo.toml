[package]
name = "polaris-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# polaris-market itself is NOT a dependency anywhere (see lib.rs's
# `MarketContract` trait doc for why) — its callable surface is hand-declared
# as a `#[contractclient]` trait, so no compiled wasm is needed to build or
# test this crate. Tests still deploy a real market from its release wasm
# (`include_bytes!` in test.rs), which is a test-only, CI-ordered concern.
polaris-ctf-math = { path = "../ctf-math" }
polaris-mock-lazer = { path = "../mock-lazer" }
