[package]
name = "polaris-market"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
pyth-lazer-stellar-sdk = { workspace = true }
# rlib-only, no #[contract] in it — safe as a normal (non-dev) dependency,
# unlike a real Cargo dependency on a sibling *contract* crate would be.
# See polaris-ctf-math/Cargo.toml's doc comment.
polaris-ctf-math = { path = "../ctf-math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
polaris-test-utils = { path = "../test-utils" }

[features]
testutils = ["soroban-sdk/testutils"]
