name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: just test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa3d70b0b1f0b0e0e0b0e0e0b0e0e0b0e0e0b0e0 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # `just test` builds polaris-market's wasm first, then the rest, then
      # runs the workspace tests — the `contractimport!` build order lives in
      # the justfile, not here (see contracts/vault/src/lib.rs for why).
      - run: just test

  coverage:
    name: cargo llvm-cov --workspace --lcov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build polaris-market's wasm first
        # Same `contractimport!` file dependency as the `test` job above —
        # the coverage run compiles and runs the same native test binaries,
        # so it needs the same pre-built wasm.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
      - name: Generate LCOV coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Print per-crate summary
        # Surfaces line coverage for the funds-critical crates in the job log
        # so a regression is visible in review without downloading the
        # artifact. Baseline numbers live in README.md.
        run: |
          cargo llvm-cov report --summary-only \
            --package polaris-market --package polaris-perpetual
      - name: Upload LCOV report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          if-no-files-found: error

  doc:
    name: cargo doc --workspace --no-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market's wasm first
        # Same `contractimport!` file dependency as the test job above:
        # rustdoc still expands macros, so the sibling wasm must exist on
        # disk before `cargo doc` runs.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
      - name: cargo doc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  wasm-build:
    name: release WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa3d70b0b1f0b0e0e0b0e0e0b0e0e0b0e0e0b0e0 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # Build order (polaris-market first) is encoded in the justfile.
      - run: just build-wasm

  wasm-build-with-logs:
    name: release-with-logs WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # Keeps the `release-with-logs` profile (Cargo.toml) from rotting: it is
      # only for diagnostic testnet deploys, never mainnet, but it must still
      # compile. Same ordering constraint as the wasm-build job above, encoded
      # in the justfile.
      - run: just build-wasm-logs
