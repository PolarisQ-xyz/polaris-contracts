name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: cargo fmt --all -- --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned channel/components/targets from rust-toolchain.toml,
      # so CI and local builds use the same Rust version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market's wasm first
        # contracts/vault AND contracts/smart-wallet-factory both read
        # sibling contracts' compiled wasm as *files* at macro-expansion
        # time via `contractimport!`, even for a native `cargo test` build —
        # a dependency invisible to Cargo's own build graph (see the
        # identical steps in the wasm-build job below, and
        # contracts/vault/src/lib.rs, for why). A fresh CI runner has never
        # built anything, so `cargo test --workspace` fails outright without
        # this — confirmed live: this exact gap was in production, broken,
        # since the vault was first added, because every local run had
        # already built the wasm manually first and never hit it.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
      - run: cargo test --workspace

  wasm-build:
    name: release WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build polaris-market first
        # polaris-vault's `contractimport!` reads polaris-market's compiled
        # wasm as a *file*, at macro-expansion time — a dependency invisible
        # to Cargo's own build graph (deliberately: a real Cargo dependency
        # on polaris-market here caused a wasm export symbol collision, see
        # contracts/vault/src/lib.rs). Cargo has no reason to order these
        # two builds relative to each other on its own, so this step is
        # split out and run first, explicitly, rather than trusting
        # incidental scheduling to keep working.
        run: cargo build --release --target wasm32v1-none -p polaris-market
      - name: Build the rest
        run: |
          cargo build --release --target wasm32v1-none \
            -p polaris-mock-lazer -p polaris-mock-redstone -p polaris-smart-wallet \
            -p polaris-smart-wallet-factory -p polaris-vault -p polaris-perpetual
      - name: Verify README hash table is current
        # The README's "Current build" table is what polaris-oracle pins
        # MARKET_WASM_HASH/PERPETUAL_WASM_HASH against, so a stale table means
        # the backend is told to trust a wasm this repo no longer builds.
        # Fails the job (and so the PR) when any size or SHA-256 differs.
        run: |
          set -euo pipefail
          out=target/wasm32v1-none/release
          stale=0
          for wasm in "$out"/*.wasm; do
            name=$(basename "$wasm")
            size=$(stat -c %s "$wasm")
            hash=$(sha256sum "$wasm" | cut -d' ' -f1)
            row=$(grep -F "\`$name\`" README.md || true)
            if [ -z "$row" ]; then
              echo "::error file=README.md::no hash-table row for $name"
              stale=1
              continue
            fi
            if ! grep -qF "$hash" <<<"$row"; then
              echo "::error file=README.md::$name SHA-256 is $hash, README says: $row"
              stale=1
            fi
            if ! grep -qF "$(printf '%s bytes' "$size")" <<<"$row"; then
              echo "::error file=README.md::$name is $size bytes, README says: $row"
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "README hash table is stale — regenerate it (see 'Building & testing')."
            exit 1
          fi
          echo "README hash table matches the release WASMs."
      - name: Write artifact manifest
        # Per-main-commit manifest, so polaris-oracle can fetch a wasm and
        # check it against the hash it pins instead of trusting a mutable tag.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          out=target/wasm32v1-none/release
          {
            echo "commit: ${{ github.sha }}"
            echo "toolchain: $(grep channel rust-toolchain.toml)"
            echo
            echo "| Contract | Size | SHA-256 |"
            echo "|---|---|---|"
            for wasm in "$out"/*.wasm; do
              echo "| \`$(basename "$wasm")\` | $(stat -c %s "$wasm") bytes | \`$(sha256sum "$wasm" | cut -d' ' -f1)\` |"
            done
          } > "$out/MANIFEST.md"
      - name: Publish release WASMs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: polaris-wasm-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error
          retention-days: 90
      - name: Publish artifact manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: polaris-wasm-manifest-${{ github.sha }}
          path: target/wasm32v1-none/release/MANIFEST.md
          if-no-files-found: error
          retention-days: 90
