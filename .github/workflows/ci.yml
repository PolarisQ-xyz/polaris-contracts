name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: just test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa3d70b0b1f0b0e0e0b0e0e0b0e0e0b0e0e0b0e0 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      # `just test` builds polaris-market's wasm first, then the rest, then
      # runs the workspace tests — the `contractimport!` build order lives in
      # the justfile, not here (see contracts/vault/src/lib.rs for why).
      - run: just test

  wasm-build:
    name: release WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa3d70b0b1f0b0e0e0b0e0e0b0e0e0b0e0e0b0e0 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
      # Build order (polaris-market first) is encoded in the justfile.
      - run: just build-wasm

  wasm-build-with-logs:
    name: release-with-logs WASM builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # Keeps the `release-with-logs` profile (Cargo.toml) from rotting: it is
      # only for diagnostic testnet deploys, never mainnet, but it must still
      # compile. Same ordering constraint as the wasm-build job above, encoded
      # in the justfile.
      - run: just build-wasm-logs
