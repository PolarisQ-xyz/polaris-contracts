[package]
name = "smart-wallet-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
base64 = "0.22"
serde_json_core = "0.3"

[dependencies.smart-wallet]
path = "../contracts/smart-wallet"

[[bin]]
name = "client_data_json"
path = "fuzz_targets/client_data_json.rs"
test = false
doc = false

[[bin]]
name = "base64_url_encode"
path = "fuzz_targets/base64_url_encode.rs"
test = false
doc = false

[[bin]]
name = "client_data_json_duplicate_keys"
path = "fuzz_targets/client_data_json_duplicate_keys.rs"
test = false
doc = false
